// StackS Android app: a NativeActivity with no Java code.
//   libstacks_platform.so  built here from native/ (sokol_app + PS1 renderer)
//   libstacks_game.so      the C# game, built with NativeAOT by scripts/build-android.sh into nativeaot/<abi>/
plugins { id "com.android.application" }

def gameLib = file("../nativeaot/arm64-v8a/libstacks_game.so")

android {
    namespace "dev.stacks.game"
    compileSdk 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "dev.stacks.game"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                arguments "-DSP_DESKTOP=OFF", "-DSP_ANDROID_APP=ON", "-DSTACKS_GAME_LIB=${gameLib.absolutePath}"
            }
        }
    }
    externalNativeBuild {
        cmake { path file("../../native/CMakeLists.txt"); version "3.22.1" }
    }
    sourceSets {
        main { jniLibs.srcDirs = ["../nativeaot"] }   // packages libstacks_game.so
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }
}
